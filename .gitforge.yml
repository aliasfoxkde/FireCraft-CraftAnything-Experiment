name: FireCraft Studio CI

stages:
  - check
  - test
  - build

jobs:
  fmt:
    stage: check
    image: rust:1.99-bookworm
    script:
      - cd app && cargo fmt --all -- --check

  clippy:
    stage: check
    image: rust:1.99-bookworm
    script:
      - apt-get update -qq && apt-get install -y -qq libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - cd app && cargo clippy --all-targets -- -D warnings

  test:
    stage: test
    image: rust:1.99-bookworm
    script:
      - apt-get update -qq && apt-get install -y -qq libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - cd app && cargo test

  wasm:
    stage: build
    image: rust:1.99-bookworm
    script:
      - rustup target add wasm32-unknown-unknown
      - cd app && cargo build --release --target wasm32-unknown-unknown
