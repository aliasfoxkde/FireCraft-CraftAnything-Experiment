<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="FireCraft Studio — Adobe Fireworks CS6 parity vector, bitmap, and web graphics editor running in the browser via WebAssembly."/>
    <title>FireCraft Studio — Adobe Fireworks CS6 Edition</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #282828;
        }
        #firecraft-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #firecraft-canvas:focus-visible {
            outline: 2px solid #E8A33D;
            outline-offset: -2px;
        }
        #firecraft-startup-error {
            position: fixed;
            inset: 0;
            display: grid;
            place-content: center;
            gap: 12px;
            padding: 24px;
            background: #282828;
            color: #f3f3f3;
            font: 15px/1.5 system-ui, sans-serif;
            text-align: center;
        }
        #firecraft-startup-error[hidden] {
            display: none;
        }
    </style>
</head>
<body>
<canvas id="firecraft-canvas" aria-label="FireCraft Studio editor canvas" aria-describedby="firecraft-fallback">
    <span id="firecraft-fallback">
        FireCraft Studio is a vector, bitmap, and web graphics editor inspired by Adobe Fireworks CS6.
        It requires WebAssembly and WebGL2 in your browser.
    </span>
</canvas>
<div id="firecraft-startup-error" role="alert" aria-live="assertive" hidden></div>
<script type="module">
    import init from './firecraft.js';
    init({ module_or_path: './firecraft_bg.wasm' }).catch((error) => {
        console.error('FireCraft WebAssembly failed to initialize', error);
        const message = document.getElementById('firecraft-startup-error');
        if (message) {
            message.textContent = 'FireCraft could not load. Refresh the page or use a browser with WebAssembly and WebGL2 enabled.';
            message.hidden = false;
        }
    });
</script>
</body>
</html>
