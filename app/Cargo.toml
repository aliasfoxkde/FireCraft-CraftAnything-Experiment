[package]
name = "firecraft"
version = "0.3.5"
edition = "2024"
license = "MIT"
description = "FireCraft - Modern vector graphics editor, inspired by Adobe Fireworks CS6"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
perf = "warn"
style = "warn"

[dependencies]
eframe = { version = "0.37", features = ["glow", "persistence"] }
egui = { version = "0.37", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico"] }
geo = { version = "0.33.1", default-features = false }
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["ClipboardEvent", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Document", "Element", "Event", "EventTarget", "File", "FileReader", "HtmlCanvasElement", "HtmlElement", "Window", "console"] }

[profile.release]
# Ship a compact, symbol-free binary. Rust has no separate runtime "minify" pass, so size and
# memory are controlled through codegen: whole-program LTO, one codegen unit, abort-on-panic,
# and stripping symbols/debuginfo. Machine code is already optimized before packaging.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
