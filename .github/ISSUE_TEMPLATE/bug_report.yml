name: Bug report
description: Report a defect in FireCraft
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please search existing issues first.
  - type: input
    id: version
    attributes:
      label: FireCraft version
      description: Output of `firecraft --version`
      placeholder: firecraft 0.3.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - Linux (X11)
        - Linux (Wayland)
        - WebAssembly (browser)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the status-bar message or any panic text.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or document
      description: Drag in a screenshot, or attach the smallest document that reproduces it.
