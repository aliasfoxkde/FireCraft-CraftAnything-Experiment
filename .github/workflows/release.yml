---
name: Build, Release & Deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Release quality gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: app
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e  # v2
        with:
          tool: cargo-audit,cargo-deny,cargo-llvm-cov
      - name: Install eframe system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev
      - name: Run every repository gate
        run: ./scripts/ci-local.sh

  build-windows:
    name: Windows x86_64
    needs: quality
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: app
      - name: Build Windows release binary
        run: cargo build --locked --release
      - name: Smoke-test binary
        shell: bash
        run: |
          exe=target/release/firecraft.exe
          "$exe" --version
          "$exe" list-commands > commands.txt
          test "$(wc -l < commands.txt)" -ge 60
          "$exe" info --demo
      - name: Package Windows bundle
        shell: bash
        run: cd .. && ./scripts/package-windows.sh "app/target/release/firecraft.exe"
      - name: Verify Windows archive checksum
        shell: bash
        run: cd dist && sha256sum -c "$(basename "$(ls firecraft-v*-windows-x86_64.zip.sha256)")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: firecraft-windows-x86_64
          if-no-files-found: error
          path: |
            app/dist/firecraft-v*-windows-x86_64.zip
            app/dist/firecraft-v*-windows-x86_64.zip.sha256

  build-macos:
    name: macOS universal (arm64 + x86_64)
    needs: quality
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: app
      - name: Build both macOS architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p ../app/dist/macos
          lipo -create \
            target/aarch64-apple-darwin/release/firecraft \
            target/x86_64-apple-darwin/release/firecraft \
            -output ../app/dist/macos/firecraft
      - name: Smoke-test universal binary
        run: |
          ../app/dist/macos/firecraft --version
          ../app/dist/macos/firecraft list-commands > /tmp/firecraft-commands.txt
          test "$(wc -l < /tmp/firecraft-commands.txt)" -ge 60
          ../app/dist/macos/firecraft info --demo
          lipo -info ../app/dist/macos/firecraft
      - name: Package macOS app bundle
        run: |
          cd ..
          ./scripts/package-macos.sh app/dist/macos/firecraft app/dist/macos
      - name: Verify macOS package checksums
        run: cd ../app/dist/macos && shasum -a 256 -c SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: firecraft-macos-universal
          if-no-files-found: error
          path: |
            app/dist/macos/firecraft-v*-macos-universal.zip
            app/dist/macos/firecraft-v*-macos-universal.dmg
            app/dist/macos/SHA256SUMS.txt

  build-linux:
    name: Linux x86_64 packages
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: app
      - name: Install desktop and packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libssl-dev libgl1-mesa-dev libfontconfig1-dev libfreetype6-dev libfuse2 \
            dpkg-dev flatpak flatpak-builder jq curl file patchelf zip desktop-file-utils \
            appstream-compose ripgrep
      - name: Build Linux release binary
        working-directory: app
        run: cargo build --locked --release
      - name: Package Linux archives and installers
        run: ./scripts/package-linux.sh app/target/release/firecraft app/dist/linux
      - name: Verify Linux package checksums
        run: cd app/dist/linux && sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: firecraft-linux-x86_64
          if-no-files-found: error
          path: |
            app/dist/linux/firecraft-v*-linux-x86_64.tar.gz
            app/dist/linux/firecraft-v*-linux-x86_64.AppImage
            app/dist/linux/firecraft_*_amd64.deb
            app/dist/linux/firecraft-v*-linux-x86_64.flatpak
            app/dist/linux/SHA256SUMS.txt
            app/dist/linux/PACKAGE-MANIFEST.json

  build-wasm:
    name: WebAssembly app
    needs: quality
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: app
      - name: Install wasm-bindgen-cli matching Cargo.lock
        run: cargo install wasm-bindgen-cli --locked --version 0.2.130
      - name: Build and smoke-test WASM bundle
        run: |
          version="$(../scripts/version.sh)"
          cargo build --locked --release --target wasm32-unknown-unknown
          mkdir -p dist/wasm
          wasm-bindgen --out-dir dist/wasm --target web --no-typescript \
            target/wasm32-unknown-unknown/release/firecraft.wasm
          cp favicon.png index.html dist/wasm/
          printf 'FireCraft %s\nsource: %s\n' "$version" "$(git rev-parse HEAD)" > dist/wasm/BUILD-INFO.txt
          test -s dist/wasm/firecraft_bg.wasm
          test -s dist/wasm/firecraft.js
          test -s dist/wasm/index.html
          cd dist/wasm
          zip -qr "../firecraft-v${version}-wasm32-web.zip" .
          cd ..
          sha256sum "firecraft-v${version}-wasm32-web.zip" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: firecraft-wasm32-web
          if-no-files-found: error
          path: |
            app/dist/firecraft-v*-wasm32-web.zip
            app/dist/SHA256SUMS.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: app/dist/wasm

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux, build-wasm]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: firecraft-*
          path: artifacts
      - name: Validate source and exact release asset set
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          version="$(scripts/version.sh)"
          test "$TAG" = "v$version" || {
            echo "tag $TAG does not match app/Cargo.toml v$version" >&2
            exit 1
          }
          mkdir -p release-assets
          cp "artifacts/firecraft-windows-x86_64/firecraft-v${version}-windows-x86_64.zip" release-assets/
          cp "artifacts/firecraft-macos-universal/firecraft-v${version}-macos-universal.zip" release-assets/
          cp "artifacts/firecraft-macos-universal/firecraft-v${version}-macos-universal.dmg" release-assets/
          cp "artifacts/firecraft-linux-x86_64/firecraft-v${version}-linux-x86_64.tar.gz" release-assets/
          cp "artifacts/firecraft-linux-x86_64/firecraft-v${version}-linux-x86_64.AppImage" release-assets/
          cp "artifacts/firecraft-linux-x86_64/firecraft_${version}_amd64.deb" release-assets/
          cp "artifacts/firecraft-linux-x86_64/firecraft-v${version}-linux-x86_64.flatpak" release-assets/
          cp "artifacts/firecraft-wasm32-web/firecraft-v${version}-wasm32-web.zip" release-assets/
          cp artifacts/firecraft-linux-x86_64/PACKAGE-MANIFEST.json release-assets/
          jq -e --arg sha "$EXPECTED_SHA" \
            '.source_revision == $sha and .working_tree_clean == true' \
            release-assets/PACKAGE-MANIFEST.json >/dev/null
          unzip -p "release-assets/firecraft-v${version}-windows-x86_64.zip" BUILD-INFO.txt \
            | grep -Fx "source: $EXPECTED_SHA"
          unzip -p "release-assets/firecraft-v${version}-macos-universal.zip" \
            FireCraft.app/Contents/Resources/BUILD-INFO.txt \
            | grep -Fx "source: $EXPECTED_SHA"
          tar -xOzf "release-assets/firecraft-v${version}-linux-x86_64.tar.gz" \
            "firecraft-v${version}-linux-x86_64/BUILD-INFO.txt" \
            | grep -Fx "Source revision: $EXPECTED_SHA"
          unzip -p "release-assets/firecraft-v${version}-wasm32-web.zip" BUILD-INFO.txt \
            | grep -Fx "source: $EXPECTED_SHA"
          expected=8
          actual=$(find release-assets -maxdepth 1 -type f \( \
            -name '*.zip' -o -name '*.dmg' -o -name '*.tar.gz' -o \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.flatpak' \) | wc -l)
          test "$actual" -eq "$expected" || {
            echo "expected $expected platform assets, found $actual" >&2
            exit 1
          }
          (cd release-assets && sha256sum -- *.zip *.dmg *.tar.gz *.AppImage *.deb *.flatpak > SHA256SUMS.txt)
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          jq -n \
            --arg version "$version" \
            --arg source_sha "$EXPECTED_SHA" \
            --arg tag "$TAG" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile packages release-assets/PACKAGE-MANIFEST.json \
            '{version:$version,tag:$tag,source_sha:$source_sha,built_at_utc:$built_at,linux_packages:$packages[0]}' \
            > release-assets/RELEASE-MANIFEST.json
          printf '%s\n' "$EXPECTED_SHA" > release-assets/SOURCE-SHA.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | sort > existing-assets.txt
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
            if ! diff -u expected-assets.txt existing-assets.txt; then
              echo "Existing release has a different asset set; refusing to leave stale or partial assets." >&2
              exit 1
            fi
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

  deploy-wasm:
    name: Deploy the release WASM app to GitHub Pages
    needs: [build-wasm, publish-release]
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
        id: deployment

  deploy-cloudflare-wasm-review:
    name: Deploy the release WASM app to Cloudflare review Pages
    needs: [build-wasm, publish-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: firecraft-wasm32-web
          path: artifacts
      - name: Prepare the exact tag-built WASM bundle
        id: preview
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(scripts/version.sh)"
          branch="wasm-review-$(printf '%s' "$RELEASE_TAG" | tr '.' '-')"
          mkdir -p dist/wasm
          unzip -q "artifacts/firecraft-v${version}-wasm32-web.zip" -d dist/wasm
          grep -Fx "FireCraft $version" dist/wasm/BUILD-INFO.txt
          grep -Fx "source: $EXPECTED_SHA" dist/wasm/BUILD-INFO.txt
          test -s dist/wasm/firecraft.js
          test -s dist/wasm/firecraft_bg.wasm
          {
            echo "branch=$branch"
            echo "url=https://${branch}.firecraft-web.pages.dev"
          } >> "$GITHUB_OUTPUT"
      - name: Deploy the versioned preview (production remains untouched)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.169.0"
          command: pages deploy dist/wasm --project-name=firecraft-web --branch=${{ steps.preview.outputs.branch }} --commit-hash=${{ github.sha }} --commit-message="FireCraft ${{ github.ref_name }} review"
      - name: Verify Cloudflare preview bytes and MIME types
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          ready=false
          for _ in $(seq 1 12); do
            status="$(curl --silent --show-error --output "$work/index.html" --write-out '%{http_code}' "$PREVIEW_URL/")" || true
            if [ "$status" = 200 ]; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true
          for asset in BUILD-INFO.txt firecraft.js firecraft_bg.wasm favicon.png; do
            status="$(curl --silent --show-error --dump-header "$work/headers" --output "$work/$asset" --write-out '%{http_code}' "$PREVIEW_URL/$asset")"
            test "$status" = 200
            case "$asset" in
              BUILD-INFO.txt) grep -qi '^content-type: text/plain' "$work/headers" ;;
              firecraft.js) grep -Eqi '^content-type: (text|application)/javascript' "$work/headers" ;;
              firecraft_bg.wasm) grep -Eqi '^content-type: application/wasm' "$work/headers" ;;
              favicon.png) grep -Eqi '^content-type: image/png' "$work/headers" ;;
            esac
            cmp "dist/wasm/$asset" "$work/$asset"
          done
          grep -Fx "FireCraft $(scripts/version.sh)" "$work/BUILD-INFO.txt"
          grep -Fx "source: $EXPECTED_SHA" "$work/BUILD-INFO.txt"
          echo "Cloudflare review preview verified: $PREVIEW_URL/"
