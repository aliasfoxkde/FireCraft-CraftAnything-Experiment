name: Build, Release & Deploy WASM

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Run Clippy & Unit Tests
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build Windows Release Binary
        run: cargo build --release
      - name: Package Windows bundle
        shell: bash
        run: cd .. && ./scripts/package-windows.sh "app/target/release/firecraft.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: firecraft-windows-x86_64
          path: app/dist/firecraft-v*-windows-x86_64.zip*

  build-wasm:
    name: Build WebAssembly (WASM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked
      - name: Build WASM Release
        run: |
          version="$(../scripts/version.sh)"
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p dist/wasm
          wasm-bindgen --out-dir dist/wasm --target web --no-typescript \
            target/wasm32-unknown-unknown/release/firecraft.wasm
          cp favicon.png index.html dist/wasm/
          cd dist/wasm && zip -qr "../firecraft-v${version}-wasm32-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: firecraft-wasm32-web
          path: app/dist/firecraft-v*-wasm32-web.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/wasm

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 Checksums
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Verify checksums
        run: cd artifacts && sha256sum -c SHA256SUMS.txt
      - name: Check tag matches Cargo version
        run: |
          version="$(scripts/version.sh)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "tag $GITHUB_REF_NAME does not match app/Cargo.toml v$version"; exit 1; }
      - name: Publish Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" artifacts/*.zip artifacts/SHA256SUMS.txt --clobber || \
          gh release create "$TAG" artifacts/*.zip artifacts/SHA256SUMS.txt \
            --title "FireCraft Studio $TAG" --generate-notes
