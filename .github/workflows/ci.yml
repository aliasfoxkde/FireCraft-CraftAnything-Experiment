name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-gates:
    name: Gates (fmt, clippy, tests, docs, WASM, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-llvm-cov
      - name: Install eframe system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev
      - name: Run every gate
        run: ./scripts/ci-local.sh

  windows-build:
    name: Windows build and CLI smoke
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build Windows release binary
        run: cargo build --release
      - name: Smoke-test the produced binary
        shell: bash
        run: |
          exe=target/release/firecraft.exe
          "$exe" --version
          "$exe" list-commands > commands.txt
          test "$(wc -l < commands.txt)" -ge 60
          "$exe" info --demo
      - name: Package bundle
        shell: bash
        run: cd .. && ./scripts/package-windows.sh "app/target/release/firecraft.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: firecraft-windows-x86_64
          path: app/dist/firecraft-v*-windows-x86_64.zip*

  wasm-build:
    name: WASM build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked
      - name: Build WASM release
        run: |
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p dist/wasm
          wasm-bindgen --out-dir dist/wasm --target web --no-typescript \
            target/wasm32-unknown-unknown/release/firecraft.wasm
          cp favicon.png index.html dist/wasm/
