name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Test & WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Check formatting
        run: cargo fmt --manifest-path app/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path app/Cargo.toml --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path app/Cargo.toml
      - name: Check WASM build
        run: cargo check --manifest-path app/Cargo.toml --target wasm32-unknown-unknown
