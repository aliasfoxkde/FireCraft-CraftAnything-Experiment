---
name: Code coverage

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out the source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview

      - name: Install eframe system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e
        with:
          tool: cargo-llvm-cov

      - name: Run tests and generate Cobertura coverage
        run: >-
          cargo llvm-cov --workspace --cobertura
          --output-path target/cobertura.xml

      - name: Verify Cobertura report exists
        run: |
          report=target/cobertura.xml
          if [[ ! -s "$report" ]]; then
            echo "::error::Missing or empty Cobertura report: app/$report"
            exit 1
          fi

      - name: Preserve Cobertura report for the upload job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-cobertura
          path: app/target/cobertura.xml
          if-no-files-found: error
          retention-days: 1

  upload-coverage:
    name: Upload Rust coverage
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # GitHub Code Quality permission; actionlint 1.7.12 predates this name.
      code-quality: write
    steps:
      - name: Download Cobertura report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rust-cobertura
          path: app/target

      - name: Upload coverage to GitHub Code Quality
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: >-
          actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52
        with:
          file: app/target/cobertura.xml
          language: Rust
          label: code-coverage/cargo-llvm-cov
          # GitHub Code Quality API availability depends on repository entitlement.
          # The Cobertura artifact remains the authoritative coverage receipt.
          fail-on-error: false
